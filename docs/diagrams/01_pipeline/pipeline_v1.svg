<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="352" viewBox="0 0 460 176" role="img" aria-label="Camden FOI RAG pipeline: an offline ingest lane builds a pgvector store; the per-query lane embeds the question, retrieves 50 chunks, reranks to 5 with Claude Sonnet 4.6 and generates a cited answer">
  <style>
    /* House style: BBK report diagrams (docs/alphaedit-chart-style-guide.md), accent swapped
       from indigo #645AC6 to green #00703C; pale fills #CDEBD7 / #F1F7F3.
       Colours are literal so the file renders standalone. */
    .tk  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7.4px; fill: #161C22; }
    .tm  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.6px; fill: #97A5B3; }
    .ts  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.2px; fill: #97A5B3; }
    .tl  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.6px; letter-spacing: .08em; fill: #97A5B3; }
    .tw  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.6px; fill: #FFFFFF; }
    .twb { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7.4px; font-weight: 600; fill: #FFFFFF; }
    .c   { text-anchor: middle; }
    .r   { text-anchor: end; }
    .box  { fill: #FFFFFF; stroke: #3B4652; stroke-width: 1; }
    .p1   { fill: #CDEBD7; stroke: #3B4652; stroke-width: 1; }
    .p2   { fill: #F1F7F3; stroke: #3B4652; stroke-width: 1; }
    .acc  { fill: #00703C; stroke: #3B4652; stroke-width: 1; }
    .boxd { fill: none; stroke: #97A5B3; stroke-width: 1; stroke-dasharray: 3 2.5; }
    .conn { fill: none; stroke: #97A5B3; stroke-width: 1; }
    .dash { fill: none; stroke: #97A5B3; stroke-width: 1; stroke-dasharray: 2.5 2.5; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0.6 L8 4 L0 7.4 Z" fill="#97A5B3"/>
    </marker>
  </defs>
  <rect width="460" height="176" fill="#FFFFFF"/>
  <text class="tl" x="6" y="13">INGEST · ONCE PER CORPUS</text>
  <rect class="box" x="6" y="20" width="80" height="32" rx="3"/>
  <text class="tk" x="12" y="31">FOI PDFs</text>
  <text class="tm" x="12" y="40.5">n = 1,040</text>
  <text class="tm" x="12" y="48.5">+ metadata CSV</text>
  <rect class="box" x="98" y="20" width="80" height="32" rx="3"/>
  <text class="tk" x="104" y="31">extract</text>
  <text class="tm" x="104" y="40.5">PyMuPDF</text>
  <text class="tm" x="104" y="48.5">per page</text>
  <rect class="box" x="190" y="20" width="80" height="32" rx="3"/>
  <text class="tk" x="196" y="31">chunk</text>
  <text class="tm" x="196" y="40.5">≤ 800 tokens</text>
  <text class="tm" x="196" y="48.5">sentence bounds</text>
  <rect class="box" x="282" y="20" width="80" height="32" rx="3"/>
  <text class="tk" x="288" y="31">embed</text>
  <text class="tm" x="288" y="40.5">3-small, 1,536-d</text>
  <text class="tm" x="288" y="48.5">OpenAI</text>
  <rect class="p2" x="374" y="20" width="80" height="32" rx="3"/>
  <text class="tk" x="380" y="31">pgvector</text>
  <text class="tm" x="380" y="40.5">3,171 chunks</text>
  <text class="tm" x="380" y="48.5">HNSW, cosine</text>
  <line class="conn" x1="88" y1="36" x2="96" y2="36" marker-end="url(#arw)"/>
  <line class="conn" x1="180" y1="36" x2="188" y2="36" marker-end="url(#arw)"/>
  <line class="conn" x1="272" y1="36" x2="280" y2="36" marker-end="url(#arw)"/>
  <line class="conn" x1="364" y1="36" x2="372" y2="36" marker-end="url(#arw)"/>
  <text class="tl" x="6" y="83">QUERY · PER REQUEST</text>
  <rect class="box" x="6" y="90" width="80" height="32" rx="3"/>
  <text class="tk" x="12" y="101">question</text>
  <text class="tm" x="12" y="110.5">natural language</text>
  <text class="tm" x="12" y="118.5">+ date range</text>
  <rect class="box" x="98" y="90" width="80" height="32" rx="3"/>
  <text class="tk" x="104" y="101">embed</text>
  <text class="tm" x="104" y="110.5">same model</text>
  <rect class="box" x="190" y="90" width="80" height="32" rx="3"/>
  <text class="tk" x="196" y="101">search</text>
  <text class="tm" x="196" y="110.5">cosine</text>
  <text class="tm" x="196" y="118.5">top 50</text>
  <rect class="acc" x="282" y="90" width="80" height="32" rx="3"/>
  <text class="twb" x="288" y="101">rerank</text>
  <text class="tw" x="288" y="110.5">Claude Sonnet 4.6</text>
  <text class="tw" x="288" y="118.5">keep top 5</text>
  <rect class="box" x="374" y="90" width="80" height="32" rx="3"/>
  <text class="tk" x="380" y="101">generate</text>
  <text class="tm" x="380" y="110.5">Claude Sonnet 4.6</text>
  <text class="tm" x="380" y="118.5">sources only</text>
  <line class="conn" x1="88" y1="106" x2="96" y2="106" marker-end="url(#arw)"/>
  <line class="conn" x1="180" y1="106" x2="188" y2="106" marker-end="url(#arw)"/>
  <line class="conn" x1="272" y1="106" x2="280" y2="106" marker-end="url(#arw)"/>
  <line class="conn" x1="364" y1="106" x2="372" y2="106" marker-end="url(#arw)"/>
  <path class="conn" d="M414 54 L414 68 L230 68 L230 88" marker-end="url(#arw)"/>
  <text class="tm" x="236" y="64">nearest 50 of 3,171</text>
  <line class="conn" x1="414" y1="124" x2="414" y2="134" marker-end="url(#arw)"/>
  <rect class="p1" x="374" y="136" width="80" height="32" rx="3"/>
  <text class="tk" x="380" y="147">answer</text>
  <text class="tm" x="380" y="156.5">[SOURCE N] cites</text>
  <text class="tm" x="380" y="164.5">trace logged</text>
  <text class="tm" x="6" y="150">eval · 28 hand-labelled queries</text>
  <text class="tm" x="6" y="160">MAP 0.823 · NDCG@5 0.903 · P@1 0.964</text>
</svg>
